<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <title>ZCode Mobile</title>
    <style>
      :root {
        --bg: #161616;
        --surface: #1e1e1e;
        --surface-2: #262626;
        --border: #2e2e2e;
        --fg: #e8e8e8;
        --fg-subtle: #9a9a9a;
        --accent: #4ade80;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior-y: none;
      }
      #root { display: flex; flex-direction: column; }

      /* ---- shared ---- */
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--fg-subtle);
        font-size: 14px;
        padding: 24px;
        text-align: center;
      }
      .error-detail { font-size: 12px; color: var(--fg-subtle); word-break: break-all; }
      .retry-btn {
        margin-top: 8px; padding: 8px 20px; border-radius: 10px;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
        font-size: 14px;
      }

      /* ---- top bar ---- */
      .topbar {
        display: flex; align-items: center; gap: 10px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }
      .icon-btn {
        width: 38px; height: 38px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface-2); color: var(--fg);
        font-size: 16px; cursor: pointer;
      }
      .topbar-title {
        display: flex; align-items: center; gap: 8px;
        min-width: 0; flex: 1;
        font-weight: 600; font-size: 15px;
      }
      .folder { flex-shrink: 0; }
      .title-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .brand { font-weight: 700; letter-spacing: 0.02em; }
      .brand-sub { color: var(--fg-subtle); font-weight: 400; font-size: 12px; }
      .new-task { margin-left: auto; font-size: 18px; color: var(--accent); }

      /* ---- task list ---- */
      .list-scroll { flex: 1; overflow-y: auto; padding: 8px 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
      .task-row {
        display: flex; align-items: center; gap: 8px; width: 100%;
        padding: 12px 14px; margin-bottom: 8px;
        border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface); color: var(--fg);
        cursor: pointer; text-align: left;
      }
      .task-row:active { background: var(--surface-2); }
      .task-row-main { min-width: 0; flex: 1; }
      .task-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .task-sub { display: flex; gap: 8px; margin-top: 3px; font-size: 11px; color: var(--fg-subtle); }
      .task-status { color: var(--accent); }
      .chev { color: var(--fg-subtle); flex-shrink: 0; }

      /* ---- chat ---- */
      .perm-banner {
        padding: 8px 12px; font-size: 12px;
        background: rgba(248, 113, 113, 0.12); color: var(--danger);
        border-bottom: 1px solid var(--border);
      }
      .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 12px; }
      .bubble-row { display: flex; margin-bottom: 12px; }
      .bubble-row.user { justify-content: flex-end; }
      .bubble {
        max-width: 85%; padding: 10px 12px; border-radius: 14px;
        font-size: 14px; line-height: 1.55; word-break: break-word;
      }
      .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
      .bubble-user { background: #2f4f3e; border-bottom-right-radius: 4px; }
      .bubble-assistant { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .thought { margin: 4px 0; }
      .thought summary { font-size: 11px; color: var(--fg-subtle); cursor: pointer; }
      .thought-body { margin-top: 4px; font-size: 12px; color: var(--fg-subtle); white-space: pre-wrap; }
      .tool-line {
        font-size: 11px; color: var(--fg-subtle);
        padding: 2px 8px; margin: 3px 0;
        border-left: 2px solid var(--border);
        font-family: ui-monospace, monospace;
      }

      /* ---- composer ---- */
      .composer {
        display: flex; align-items: flex-end; gap: 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--border); background: var(--surface);
        flex-shrink: 0;
      }
      .composer textarea {
        flex: 1; min-height: 40px; max-height: 120px;
        padding: 10px 12px; border-radius: 12px;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
        font-size: 14px; font-family: inherit; resize: none;
      }
      .send-btn {
        width: 42px; height: 42px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        border: none; border-radius: 12px;
        background: var(--accent); color: #0c0c0c;
        font-size: 17px; font-weight: 700; cursor: pointer;
      }
      .send-btn:disabled { opacity: 0.35; }
      .send-btn.stop { background: var(--surface-2); color: var(--danger); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
