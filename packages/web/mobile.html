<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <title>ZCode Mobile</title>
    <style>
      :root {
        --bg: #161616;
        --surface: #1e1e1e;
        --surface-2: #262626;
        --border: #2e2e2e;
        --fg: #e8e8e8;
        --fg-subtle: #9a9a9a;
        --accent: #4ade80;
        --danger: #f87171;
        --warn: #fbbf24;
      }
      * { box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior-y: none;
      }
      #root { display: flex; flex-direction: column; }

      /* ---- screens + tab bar ---- */
      .screen-wrap {
        flex: 1;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
      }
      .tabbar {
        display: flex;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        background: var(--surface);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .tab {
        flex: 1;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 7px 0 6px;
        background: none; border: none; color: var(--fg-subtle);
        font-size: 10px; cursor: pointer;
      }
      .tab.active { color: var(--accent); }
      .tab:disabled { opacity: 0.35; }
      .tab-icon { font-size: 17px; line-height: 1; position: relative; }
      .tab-dot {
        position: absolute; top: -1px; right: -5px;
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--danger);
      }
      .tab-label { font-weight: 500; }

      /* ---- shared ---- */
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--fg-subtle);
        font-size: 14px;
        padding: 24px;
        text-align: center;
      }
      .error-detail { font-size: 12px; color: var(--fg-subtle); word-break: break-all; }
      .retry-btn {
        margin-top: 8px; padding: 8px 20px; border-radius: 10px;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
        font-size: 14px;
      }

      /* ---- top bar ---- */
      .topbar {
        display: flex; align-items: center; gap: 10px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }
      .icon-btn {
        width: 38px; height: 38px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface-2); color: var(--fg);
        font-size: 16px; cursor: pointer;
      }
      .topbar-title {
        display: flex; align-items: center; gap: 8px;
        min-width: 0; flex: 1;
        font-weight: 600; font-size: 15px;
      }
      .folder { flex-shrink: 0; }
      .title-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .brand { font-weight: 700; letter-spacing: 0.02em; }
      .brand-sub { color: var(--fg-subtle); font-weight: 400; font-size: 12px; }
      .new-task { margin-left: auto; font-size: 18px; color: var(--accent); }
      .generating-badge { color: var(--accent); animation: pulse 1.2s infinite; flex-shrink: 0; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

      /* ---- workspace selector ---- */
      .ws-chips {
        display: flex; gap: 6px; overflow-x: auto;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .ws-chip {
        white-space: nowrap; padding: 6px 12px;
        border-radius: 999px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--fg-subtle);
        font-size: 12px; cursor: pointer;
      }
      .ws-chip.active { color: var(--accent); border-color: var(--accent); }
      .ws-line {
        display: flex; align-items: center; gap: 6px;
        padding: 8px 12px;
        font-size: 12px; color: var(--fg-subtle);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      /* ---- task list ---- */
      .list-scroll { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
      .task-row-wrap {
        position: relative;
        display: flex; align-items: stretch; gap: 0;
        margin-bottom: 8px;
        border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface);
        overflow: hidden;
      }
      .task-row-wrap.active { border-color: var(--accent); }
      .task-row {
        display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
        padding: 12px 0 12px 14px;
        border: none; background: none; color: var(--fg);
        cursor: pointer; text-align: left;
      }
      .task-row:active { background: var(--surface-2); }
      .task-row-main { min-width: 0; flex: 1; }
      .task-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .task-sub { display: flex; gap: 8px; margin-top: 3px; font-size: 11px; color: var(--fg-subtle); }
      .task-status { color: var(--accent); }
      .chev { color: var(--fg-subtle); flex-shrink: 0; }
      .row-actions {
        width: 40px; flex-shrink: 0;
        border: none; border-left: 1px solid var(--border);
        background: none; color: var(--fg-subtle);
        font-size: 15px; letter-spacing: 1px; cursor: pointer;
      }
      .row-actions:active { background: var(--surface-2); }
      .archived-tag {
        position: absolute; top: 6px; right: 48px;
        font-size: 9px; color: var(--warn);
        border: 1px solid var(--warn); border-radius: 4px;
        padding: 0 4px; opacity: 0.8;
      }
      .archived-toggle {
        display: flex; align-items: center; gap: 6px;
        width: 100%; padding: 10px 4px; margin-top: 4px;
        border: none; background: none; color: var(--fg-subtle);
        font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .archived-count {
        background: var(--surface-2); border-radius: 999px;
        padding: 0 7px; font-size: 11px;
      }
      .archived-section { padding-bottom: 8px; }
      .delete-all-btn {
        width: 100%; margin-top: 4px; padding: 10px;
        border: 1px solid var(--danger); border-radius: 12px;
        background: none; color: var(--danger);
        font-size: 13px; cursor: pointer;
      }

      /* ---- chat ---- */
      .perm-banner {
        padding: 8px 12px; font-size: 12px;
        background: rgba(248, 113, 113, 0.12); color: var(--danger);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 12px; }
      .bubble-row { display: flex; margin-bottom: 12px; }
      .bubble-row.user { justify-content: flex-end; }
      .bubble {
        max-width: 85%; padding: 10px 12px; border-radius: 14px;
        font-size: 14px; line-height: 1.55; word-break: break-word;
      }
      .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
      .bubble-user { background: #2f4f3e; border-bottom-right-radius: 4px; }
      .bubble-assistant { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .bubble.typing { color: var(--fg-subtle); animation: pulse 1.2s infinite; }
      .thought { margin: 4px 0; }
      .thought summary { font-size: 11px; color: var(--fg-subtle); cursor: pointer; }
      .thought-body { margin-top: 4px; font-size: 12px; color: var(--fg-subtle); white-space: pre-wrap; }
      .tool-line {
        font-size: 11px; color: var(--fg-subtle);
        padding: 2px 8px; margin: 3px 0;
        border-left: 2px solid var(--border);
        font-family: ui-monospace, monospace;
      }

      /* ---- composer ---- */
      .composer {
        display: flex; flex-direction: column; gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid var(--border); background: var(--surface);
        flex-shrink: 0;
      }
      .composer-chips {
        display: flex; gap: 6px; overflow-x: auto;
        scrollbar-width: none;
      }
      .composer-chips::-webkit-scrollbar { display: none; }
      .chip {
        display: flex; align-items: center; gap: 4px;
        white-space: nowrap;
        padding: 6px 10px;
        border-radius: 999px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--fg);
        font-size: 12px; cursor: pointer;
      }
      .chip-ellipsis { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .composer-input-row { display: flex; align-items: flex-end; gap: 8px; }
      .composer textarea {
        flex: 1; min-height: 40px; max-height: 120px;
        padding: 10px 12px; border-radius: 12px;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
        font-size: 14px; font-family: inherit; resize: none;
      }
      .send-btn {
        width: 42px; height: 42px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        border: none; border-radius: 12px;
        background: var(--accent); color: #0c0c0c;
        font-size: 17px; font-weight: 700; cursor: pointer;
      }
      .send-btn:disabled { opacity: 0.35; }
      .send-btn.stop { background: var(--surface-2); color: var(--danger); border: 1px solid var(--border); }

      /* ---- bottom sheet ---- */
      .sheet-backdrop {
        position: fixed; inset: 0; z-index: 40;
        background: rgba(0, 0, 0, 0.55);
        display: flex; align-items: flex-end;
      }
      .sheet {
        width: 100%; max-height: 70vh;
        display: flex; flex-direction: column;
        background: var(--surface);
        border-top: 1px solid var(--border);
        border-radius: 16px 16px 0 0;
        padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
      }
      .sheet-grip {
        width: 36px; height: 4px; border-radius: 2px;
        background: var(--border); margin: 4px auto 8px;
      }
      .sheet-title {
        padding: 2px 16px 8px;
        font-size: 13px; font-weight: 600; color: var(--fg-subtle);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .sheet-scroll { overflow-y: auto; }
      .sheet-group {
        padding: 8px 16px 4px;
        font-size: 11px; font-weight: 600; color: var(--fg-subtle);
        text-transform: uppercase; letter-spacing: 0.04em;
      }
      .sheet-option {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        width: 100%; padding: 11px 16px;
        border: none; background: none; color: var(--fg);
        font-size: 14px; cursor: pointer; text-align: left;
      }
      .sheet-option:active { background: var(--surface-2); }
      .sheet-option.selected { color: var(--accent); }
      .sheet-option.danger { color: var(--danger); }
      .sheet-option-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .sheet-option-label { font-weight: 500; }
      .sheet-option-sub { font-size: 11px; color: var(--fg-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sheet-check { flex-shrink: 0; }
      .sheet-tail-space { height: 4px; }
      .confirm-message {
        padding: 2px 16px 10px;
        font-size: 13px; color: var(--fg-subtle);
        word-break: break-word;
      }
      .confirm-actions { display: flex; gap: 8px; padding: 0 16px; }
      .confirm-btn {
        flex: 1; padding: 11px; border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface-2); color: var(--fg);
        font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .confirm-btn.danger {
        background: var(--danger); border-color: var(--danger); color: #0c0c0c;
      }

      /* ---- info screen ---- */
      .info-scroll { flex: 1; overflow-y: auto; padding: 12px; }
      .info-section {
        border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface);
        padding: 10px 12px; margin-bottom: 10px;
      }
      .info-section-title {
        font-size: 11px; font-weight: 700; color: var(--fg-subtle);
        text-transform: uppercase; letter-spacing: 0.05em;
        margin-bottom: 8px;
      }
      .info-note { font-size: 12px; color: var(--fg-subtle); }
      .kv-row {
        display: flex; justify-content: space-between; gap: 12px;
        padding: 4px 0; font-size: 13px;
      }
      .kv-label { color: var(--fg-subtle); flex-shrink: 0; }
      .kv-value { text-align: right; word-break: break-all; }
      .meter {
        height: 8px; border-radius: 4px; overflow: hidden;
        background: var(--surface-2); margin: 2px 0 8px;
      }
      .meter-fill {
        height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, var(--accent), var(--warn));
      }
      .agent-row { display: flex; gap: 8px; padding: 6px 0; min-width: 0; }
      .agent-dot {
        width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        margin-top: 5px; background: var(--fg-subtle);
      }
      .agent-dot.running, .agent-dot.waiting { background: var(--accent); animation: pulse 1.2s infinite; }
      .agent-dot.success, .agent-dot.completed { background: var(--accent); }
      .agent-dot.failed, .agent-dot.errored, .agent-dot.cancelled, .agent-dot.lost, .agent-dot.blocked { background: var(--danger); }
      .agent-main { min-width: 0; flex: 1; }
      .agent-title { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .agent-sub { font-size: 11px; color: var(--fg-subtle); margin-top: 1px; }
      .job-tail {
        margin: 4px 0 0; padding: 6px 8px;
        background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
        font-size: 10px; font-family: ui-monospace, monospace;
        color: var(--fg-subtle);
        max-height: 90px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      }
      .plan-row { display: flex; gap: 8px; padding: 3px 0; font-size: 13px; }
      .plan-mark { flex-shrink: 0; }
      .plan-mark:nth-of-type(1) { color: inherit; }
      .plan-title { min-width: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
